<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal dipindahkan — gunakan gassterus.com</title>
  <meta name="description" content="crm-ga.vercel.app sudah dinonaktifkan. Silakan gunakan gassterus.com." />
  <!-- Alihkan otomatis setelah 8 detik. Hapus baris di bawah jika tidak ingin auto-redirect. -->
  <meta http-equiv="refresh" content="8; url=https://gassterus.com" />
  <style>
    :root{ --navy:#0a2340; --green:#16a34a; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      min-height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:22px; padding:24px;
      background:radial-gradient(1000px 600px at 80% 10%, #14427a 0%, rgba(20,66,122,0) 60%), var(--navy);
      font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color:#dbe6f5;
    }
    a.card{
      display:block; width:100%; max-width:1100px; line-height:0;
      border-radius:18px; overflow:hidden;
      box-shadow:0 24px 60px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    a.card:hover{ transform:translateY(-3px); box-shadow:0 30px 70px rgba(0,0,0,.55); }
    a.card img{ display:block; width:100%; height:auto; }

    .actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; }
    .btn{
      display:inline-flex; align-items:center; gap:10px;
      background:linear-gradient(135deg,#16a34a,#12833d); color:#fff;
      font-size:18px; font-weight:800; text-decoration:none;
      padding:14px 30px; border-radius:999px;
      box-shadow:0 14px 34px rgba(22,163,74,.4);
    }
    .btn:hover{ filter:brightness(1.06); }
    .note{ font-size:14px; color:#9fb6d4; text-align:center; }
    .note b{ color:#7ef0a6; }
    @media (max-width:520px){ .btn{ font-size:16px; padding:12px 24px; } }
  </style>
</head>
<body>
  <!-- Klik gambar = buka gassterus.com -->
  <a class="card" href="https://gassterus.com" rel="noopener">
    <img src="landing-gassterus.png"
         alt="crm-ga.vercel.app sudah dinonaktifkan. Silakan gunakan gassterus.com!" />
  </a>

  <div class="actions">
    <a class="btn" href="https://gassterus.com" rel="noopener">Buka gassterus.com →</a>
  </div>

  <p class="note">
    <b>crm-ga.vercel.app</b> sudah dinonaktifkan. Anda akan dialihkan otomatis ke
    <b>gassterus.com</b> dalam <span id="cd">8</span> detik&hellip;
  </p>

  <script>
    // Hitung mundur + alihkan (cadangan JS bila meta-refresh tidak jalan)
    (function () {
      var n = 8, el = document.getElementById('cd');
      var t = setInterval(function () {
        n--; if (el) el.textContent = n;
        if (n <= 0) { clearInterval(t); location.href = 'https://gassterus.com'; }
      }, 1000);
    })();
  </script>
</body>
</html>
